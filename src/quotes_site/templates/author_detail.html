{% extends 'base.html' %}

{% block title %}{{ author.fullname }} - Biography{% endblock %}

{% block content %}
    <h2>{{ author.fullname }}</h2>
    <div class="author-detail" style="margin-top: 20px;">
        <p><strong>Born:</strong> {{ author.born_date }} in {{ author.born_location }}</p>
        <hr style="border: 0; border-top: 1px solid #dee2e6; margin: 20px 0;">
        <p><strong>Biography:</strong></p>
        <p style="white-space: pre-line;">{{ author.description }}</p>
    </div>
{% endblock %}
